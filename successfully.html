<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Withdrawal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

   
    <div class="image-container">
      <img src="with.png" alt="Withdrawal">
    </div>

    <h2>Your funds are on the way!</h2>
    <p class="message">
      Your withdrawal is currently under review. We will notify you once your funds have been successfully processed.
    </p>

    <div class="buttons">
      <a href="progressBar.html"><button class="primary">Withdrawal details</button> </a>
      <a href="wallet.html"><button class="secondary">Back</button> </a>
    </div>
  </div>

<style>
:root {
  /* Default = dark mode */
  --bg-color: #000;
  --text-color: #fff;
  --subtext-color: #ccc;
  --button-bg: rgba(0, 191, 255, 1);
  --button-text: #000;
  --container-bg: transparent;
}

body.light-mode {
  --bg-color: #fff;
  --text-color: #000;
  --subtext-color: #555;
  --button-bg: black; /* stays same */
  --button-text: white;
  --container-bg: #f9f9f9;
}

body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  max-width: 400px;
  text-align: center;
  padding: 20px;
  background-color: var(--container-bg);
  border-radius: 10px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  margin-bottom: 20px;
}

.back-arrow {
  font-size: 24px;
  margin-right: 10px;
  cursor: pointer;
  color: var(--text-color);
}

.image-container img {
  width: 100%;
  border-radius: 20px;
  margin-bottom: 20px;
}

h2 {
  margin-top: 10px;
  font-size: 22px;
  color: var(--text-color);
}

.message {
  font-size: 14px;
  margin: 10px 0 30px;
  color: var(--subtext-color);
}

.buttons button {
  width: 100%;
  padding: 15px;
  margin-bottom: 10px;
  border: none;
  font-size: 16px;
  border-radius: 10px;
  cursor: pointer;
  background-color: var(--button-bg);
  color: var(--button-text);
  font-weight: bold;
  transition: background 0.3s ease;
}

.buttons button:hover {
  opacity: 0.9;
}
</style>
<script src="theme-toggle.js"></script>
</body>
</html>
