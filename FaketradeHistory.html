<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trade History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" >
 <style>
    body {
      font-family: Arial, sans-serif;
      background: black;
      padding: 0px;
      margin: 0;
    }

.container {
padding: 20px;

}

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    #status {
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;

    }

    .card {
      background: #111111;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 15px;
      margin-bottom: 15px;
font-size: 13px;
margin-top: 20px;
    }

    .card p {
      margin: 5px 0;
color: #ccc;

    }

   .card span {
      margin: 5px 0;
font-weight: none;
    }

    .win {
      color: green;
      font-weight: bold;
    }

    .lose {
      color: red;
      font-weight: bold;
    }

    .label {
      font-weight: none;
color: grey;

    }

nav {
display: flex;
justify-content: center;
align-items: center;
background-color: #333;
}

nav i {
color: white;
position: absolute;
left: 20px;
font-size: 16px;
padding: 0px;
margin-top: -5px;
}
nav h3 {
color: white;
text-align: center;
}
#filterSection {
margin-left: 30px;
color:  #ff7200;
}
#filterDate {
color: black;
}

#filterSection button {
padding: 10px;
border-radius: 10px;
color:  white;
font-size: 14px;
border: none;
background-color: green;
}

  </style>
</head>
<body>

<nav>
<div> <a href="deposit.html"> <i class="fa fa-chevron-left"></i> </a></div>

<div> <h3> Trade History </h3> </div>
</nav>

 
<div class="container" >

<div id="filterSection">
  <label for="filterDate">Select Date:</label>
  <input type="date" id="filterDate" />
  <button id="filterBtn">🔍 Filter</button>
</div>

  <div id="status">Loading trade history...</div>
  <div id="historyContainer"></div>

</div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCQW9VLyn_nfgR27PO-3MEirIbZCWRo4_Q",
      authDomain: "ohut-d7c8d.firebaseapp.com",
      projectId: "ohut-d7c8d",
      storageBucket: "ohut-d7c8d.appspot.com",
      messagingSenderId: "916521389173",
      appId: "1:916521389173:web:5cd1b9b0c87d3bf4f87c3c",
      measurementId: "G-721RMQFD2K"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const statusDiv = document.getElementById("status");
    const container = document.getElementById("historyContainer");

    auth.signInAnonymously().catch(console.error);

    auth.onAuthStateChanged(async user => {
  if (!user) {
    statusDiv.textContent = "⚠️ Not signed in.";
    return;
  }

  const historyRef = db
    .collection("users")
    .doc(user.uid)
    .collection("tradeHistory")
    .orderBy("closeTime", "desc");

  const filterBtn = document.getElementById("filterBtn");
  const filterDateInput = document.getElementById("filterDate");

  // Load all by default
  loadAndDisplayTrades();

  // When filter is clicked
  filterBtn.addEventListener("click", () => {
    const selectedDate = filterDateInput.value;
    if (!selectedDate) {
      statusDiv.textContent = "❌ Please select a valid date.";
      return;
    }

    const start = new Date(selectedDate);
    const end = new Date(start);
    end.setHours(23, 59, 59, 999);

    loadAndDisplayTrades(start.getTime(), end.getTime());
  });

  async function loadAndDisplayTrades(startTime = null, endTime = null) {
    statusDiv.style.display = "block";
    statusDiv.textContent = "⏳ Loading trade history...";
    container.innerHTML = "";

    try {
      const snapshot = await historyRef.get();
      if (snapshot.empty) {
        statusDiv.textContent = "❌ No trade history found.";
        return;
      }

      let filteredDocs = snapshot.docs;

      if (startTime && endTime) {
        filteredDocs = filteredDocs.filter(doc => {
          const data = doc.data();
          return data.closeTime >= startTime && data.closeTime <= endTime;
        });
      }

      if (filteredDocs.length === 0) {
        statusDiv.textContent = "❌ No trades found for selected date.";
        return;
      }

      statusDiv.style.display = "none";

      filteredDocs.forEach(doc => {
        const data = doc.data();
        const card = document.createElement("div");
        card.className = "card";

        const openTime = new Date(data.openTime).toLocaleString();
        const closeTime = new Date(data.closeTime).toLocaleString();
        const profit = parseFloat(data.profit).toFixed(2);
        const statusClass = data.status === "win" ? "win" : "lose";

        card.innerHTML = `
          <p><span class="label">🪙 </span> ${data.currency}</p> 

       <p><span class="label"> Result:</span> <span class="${statusClass}">${data.status.toUpperCase()}</span></p>

<p><span class="label">📄 Order ID:</span> ${data.orderId || "N/A"}</p>
          <p><span class="label"> Open:</span> ${openTime}</p>
          <p><span class="label"> Close:</span> ${closeTime}</p>
          <p><span class="label"> Direction:</span> ${data.direction?.toUpperCase() || "N/A"}</p>
          <p><span class="label"> Profit:</span> $${profit}</p>
  
         
          <p><span class="label"> Balance:</span> $${parseFloat(data.balance).toFixed(2)}</p>
        `;

        container.appendChild(card);
      });
    } catch (err) {
      console.error("Error fetching trade history:", err);
      statusDiv.textContent = "⚠️ Failed to load history.";
    }
  }
});

  </script>

</body>
</html>
