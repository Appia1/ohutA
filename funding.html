text-align: center;

  .dropdown-arrow {

  /* Buttons */
  .button-row {

  .btn {

padding: 15px;
width: 30px;

  /* Toggle switch */
  .switch {

  .switch input {

    height: 0;
  }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #555;
    transition: .4s;
    border-radius: 12px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 14px;
    width: 14px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
  }
  input:checked + .slider {
    background-color: #a9f14a;
  }
  input:checked + .slider:before {
    transform: translateX(16px);
  }
  /* Search icon */
  .search-icon {
    margin-left: auto;
    cursor: pointer;
    user-select: none;
    color: #666;
  }
  /* Tabs */
  .tabs {
    display: flex;

    border-radius: 24px;
    overflow: hidden;
    background-color: #222;
    color: #999;
font-size: 12px;
margin-top: 20px;
   
  }
  .tab {
    flex: 1;

    cursor: pointer;
    user-select: none;
  }
  .tab.active {
    color: #00FF00;
  border-bottom: 2px solid #00FF00;
font-weight: bold;
   
  }
  /* Table */
  table {
    width: 100%;

    color: #ccc;

  th, td {

    padding: 8px 6px;
    font-weight: 600;

  /* Sort arrows */

    border: solid #999;
    border-width: 0 1.5px 1.5px 0;
    display: inline-block;
    padding: 3px;
    margin-left: 4px;
    transform: rotate(45deg);
    -webkit-transform: rotate(45deg);
    cursor: pointer;
  }
  /* Rotate down */

    transform: rotate(-135deg);
  }
  /* Currency icon */
  .crypto-icon {
    width: 28px;
    height: 28px;

    background-color: #32848e;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    margin-right: 12px;
  }

  }
  /* More button */

    cursor: pointer;
    font-size: 20px;
    color: #777;
    user-select: none;
  }
  /* Small currency amount */

    color: #666;

.btn a {
color: #ccc;
font-size: 15px;
}

.filterBtn {

background-color: rgba(0, 191, 255, 1);
border-radius: 10px;

border: 0px;

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script src="firebaseDetails.js"></script>

<script>
  // Firebase Init
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let currentType = "trading"; // default

  // Load funding balance from cache first
  function loadCachedFundingBalance() {
    const cached = localStorage.getItem("userData");
    if (!cached) return updateFundingBalanceUI(0);

    try {
      const data = JSON.parse(cached);
      const fundingBalance = data.fundingBalance || 0;
      updateFundingBalanceUI(fundingBalance);
    } catch (e) {
      console.warn("Could not load cached balance:", e);
    }
  }

  //Update funding balance UI
  function updateFundingBalanceUI(amount) {
    const display = document.getElementById('fundingBalanceDisplay');
    if (display) {
      display.textContent = parseFloat(amount).toFixed(2) + " USDT";
    }
  }

  //Load from cache instantly
  loadCachedFundingBalance();

  // Auth listener for real-time Firebase sync
  auth.onAuthStateChanged(user => {
    if (user) {
      currentUser = user;

      // Fetch latest user data
      db.collection("users").doc(user.uid).get().then(doc => {
        if (doc.exists) {
          const data = doc.data();
          const fundingBalance = data.fundingBalance || 0;

          // Update UI
          updateFundingBalanceUI(fundingBalance);

          //Cache it
          localStorage.setItem("userData", JSON.stringify(data));
        } else {
          updateFundingBalanceUI(0);
        }
      }).catch(err => {
        console.error("Error loading funding balance:", err);
      });

      //Load transfer history
      loadHistory();
    } else {
      console.log("No user logged in");
      updateFundingBalanceUI(0);
      document.getElementById('historyList').innerHTML = "Please login to view history.";
    }
  });

  //Toggle views
  document.getElementById('showTrading').addEventListener('click', () => {
    currentType = "trading";
    toggleButtons("trading");
    loadHistory();
  });

  document.getElementById('showFunding').addEventListener('click', () => {
    currentType = "funding";
    toggleButtons("funding");
    loadHistory();
  });

  function toggleButtons(activeType) {
    document.getElementById('showTrading').classList.remove('active');
    document.getElementById('showFunding').classList.remove('active');
    document.getElementById(`show${capitalize(activeType)}`).classList.add('active');
  }

  function capitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  // Load transfer history
  function loadHistory() {
    const list = document.getElementById('historyList');
    list.innerHTML = "Loading...";

    if (!currentUser) {
      list.innerHTML = "Please sign in.";
      return;
    }

    const fromDateVal = document.getElementById('fromDate').value;
    const toDateVal = document.getElementById('toDate').value;

    let query = db.collection("users")
      .doc(currentUser.uid)
      .collection("transfers")
      .where("type", "==", currentType)
      .orderBy("timestamp", "desc");

    if (fromDateVal) {
      const fromDate = new Date(fromDateVal);
      fromDate.setHours(0, 0, 0, 0);
      query = query.where("timestamp", ">=", fromDate);
    }

    if (toDateVal) {
      const toDate = new Date(toDateVal);
      toDate.setHours(23, 59, 59, 999);
      query = query.where("timestamp", "<=", toDate);
    }

    query.get()
      .then(snapshot => {
        if (snapshot.empty) {
          list.innerHTML = "<p>No transfer history found.</p>";
          return;
        }

        list.innerHTML = "";

        snapshot.forEach(doc => {
          const data = doc.data();
          const entry = document.createElement("div");
          entry.className = "history-entry";
          const date = data.timestamp?.toDate().toLocaleString() || "No Date";

          entry.innerHTML = `
            <div class="value">${data.direction.replace("-", " - ").toUpperCase()}</div>
            <div class="label">Amount: ${data.amount} USDT</div>
            <div class="label">Balance After: ${data.balanceAfter} USDT</div>
            <div class="label">Date: ${date}</div>
            <div class="label">Type: ${capitalize(data.type)}</div>
          `;
          list.appendChild(entry);
        });
      })
      .catch(error => {
        console.error("Error loading history:", error);
        list.innerHTML = "<p>Error loading history: " + error.message + "</p>";
      });
  }

  //Loader utilities
  function showLoader() {
    document.getElementById('loader').style.display = 'block';
    document.getElementById('overlay').style.display = 'block';
  }

  function hideLoader() {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('overlay').style.display = 'none';
  }

  function fetchData() {
    showLoader();
    setTimeout(() => {
      console.log("Data fetched from database!");
      hideLoader();
      document.getElementById("content").innerHTML += "<p><strong>Data loaded!</strong></p>";
    }, 3000);
  }

  window.addEventListener('load', fetchData);
</script>
