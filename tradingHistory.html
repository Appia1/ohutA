<div> <h3> Trade History </h3> </div>

<div id="filterSection">
  <label for="filterDate">Select Date:</label>
  <input type="date" id="filterDate" />

  <div id="status">Loading trade history...</div>
  <div id="historyContainer"></div>

<script src="theme-toggle.js"></script>

  <!-- Firebase SDKs -->
 <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script src="firebaseDetails.js"></script>

<script>
  // Firebase initialization
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // Utility functions
  function formatNumber(val) {
    return parseFloat(val || 0).toFixed(2);
  }

  function formatDate(val) {
    if (!val) return "N/A";
    if (val.seconds) return new Date(val.seconds * 1000).toLocaleString();
    if (typeof val === "number") return new Date(val).toLocaleString();
    return "N/A";
  }

  // DOM references
  const statusDiv = document.getElementById("status");
  const container = document.getElementById("historyContainer");
  const filterBtn = document.getElementById("filterBtn");
  const filterDateInput = document.getElementById("filterDate");
  const tradingBalanceDisplay = document.getElementById("tradingBalanceDisplay");

  // --- 🧠 Load Cached Trading Balance ---
  function loadCachedTradingBalance() {
    const cached = localStorage.getItem("userData");
    if (!cached) return updateTradingBalanceUI(0);

    try {
      const data = JSON.parse(cached);
      const tradingBalance = data.tradingBalance || 0;
      updateTradingBalanceUI(tradingBalance);
    } catch (e) {
      console.warn("Could not load cached trading balance:", e);
    }
  }

  function updateTradingBalanceUI(amount) {
    if (tradingBalanceDisplay) {
      tradingBalanceDisplay.textContent = parseFloat(amount).toFixed(2) + " USDT";
    }
  }

  // Load cached balance instantly
  loadCachedTradingBalance();

  // --- 🔐 Firebase Auth ---
  firebase.auth().signInAnonymously().catch(console.error);

  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      statusDiv.textContent = "⚠️ Not signed in.";
      updateTradingBalanceUI(0);
      return;
    }

    // --- 📊 Load Latest Trading Balance ---
    db.collection("users").doc(user.uid).get().then(doc => {
      if (doc.exists) {
        const data = doc.data();
        const tradingBalance = data.tradingBalance || 0;
        updateTradingBalanceUI(tradingBalance);
        localStorage.setItem("userData", JSON.stringify(data)); // cache it
      } else {
        updateTradingBalanceUI(0);
      }
    }).catch(err => {
      console.error("Error loading trading balance:", err);
    });

    // --- 📜 Load Trade History (Unchanged) ---
    const historyRef = db
      .collection("users")
      .doc(user.uid)
      .collection("tradeHistory")
      .orderBy("closeTime", "desc");

    // Default load
    loadAndDisplayTrades();

    filterBtn.addEventListener("click", () => {
      const selectedDate = filterDateInput.value;
      if (!selectedDate) {
        statusDiv.textContent = "❌ Please select a valid date.";
        return;
      }

      const start = new Date(selectedDate);
      const end = new Date(selectedDate);
      end.setHours(23, 59, 59, 999);

      loadAndDisplayTrades(start.getTime(), end.getTime());
    });

    async function loadAndDisplayTrades(startTime = null, endTime = null) {
      statusDiv.style.display = "block";
      statusDiv.textContent = "⏳ Loading trade history...";
      container.innerHTML = "";

      try {
        const snapshot = await historyRef.get();

        if (snapshot.empty) {
          statusDiv.textContent = "❌ No trade history found.";
          return;
        }

        let trades = snapshot.docs.map(doc => doc.data());

        // Filter by date if selected
        if (startTime && endTime) {
          trades = trades.filter(t =>
            t.closeTime >= startTime && t.closeTime <= endTime
          );
        }

        if (trades.length === 0) {
          statusDiv.textContent = "❌ No trades found for selected date.";
          return;
        }

        statusDiv.style.display = "none";

        trades.forEach(data => {
          const card = document.createElement("div");
          card.className = "card";

          const openTime = formatDate(data.openTime);
          const closeTime = formatDate(data.closeTime);
          const profit = isNaN(data.profit) ? "0.00" : formatNumber(data.profit);

          const tradeResult = data.status || data.result || "N/A";
          const statusClass = tradeResult.toLowerCase() === "win" ? "win" : "lose";

          const balance =
            data.balance !== undefined
              ? `$${formatNumber(data.balance)}`
              : `<em>Not recorded</em>`;

   const type = data.type
  ? data.type.charAt(0).toUpperCase() + data.type.slice(1)
  : "Unknown";

          const currency = data.currency || "—";

          card.innerHTML = `
            <p><span class="label">🧩 Type:</span> ${type}</p>
            <p><span class="label">🪙 Currency:</span> ${currency}</p>
            <p><span class="label">Result:</span> 
              <span class="${statusClass}">${tradeResult.toUpperCase()}</span></p>
            <p><span class="label">📄 Order ID:</span> ${data.orderId || "N/A"}</p>
            <p><span class="label">Open:</span> ${openTime}</p>
            <p><span class="label">Close:</span> ${closeTime}</p>
            <p><span class="label">Direction:</span> ${data.direction?.toUpperCase() || "N/A"}</p>
            <p><span class="label">Profit:</span> $${profit}</p>
            <p><span class="label">Balance:</span> ${balance}</p>
          `;

          container.appendChild(card);
        });

      } catch (err) {
        console.error("Error loading trade history:", err);
        statusDiv.textContent = "⚠️ Failed to load history.";
      }
    }
  });
</script>
