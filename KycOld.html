<script>

let user = null;

function showMessage(msg, type = "info") {
  const message = document.getElementById("message");
  message.innerText = msg;
  message.style.color = type === "error" ? "red" : type === "success" ? "lime" : "#00ccff";
}

function showStep(step) {
  for (let i = 1; i <= 3; i++) {
    document.getElementById(`step${i}`).classList.remove("active");
  }
  document.getElementById(`step${step}`).classList.add("active");
  document.getElementById("progressText").innerText = `Step ${step} of 3`;
  localStorage.setItem("kycStep", step);
}

function nextStep(currentStep) {
  const next = currentStep + 1;
  if (next <= 3) showStep(next);
}

function prevStep(currentStep) {
  const prev = currentStep - 1;
  if (prev >= 1) showStep(prev);
}

// Load cached user data from localStorage
function loadCachedUserData() {
  const cached = localStorage.getItem("userData");
  if (!cached) return null;

  try {
    return JSON.parse(cached);
  } catch (err) {
    console.warn("Error parsing cached user data", err);
    return null;
  }
}

// Fetch and cache latest user data from Firestore
async function fetchAndCacheUserData(uid) {
  try {
    const doc = await firebaseDB.collection("users").doc(uid).get();
    if (doc.exists) {
      const data = doc.data();
      localStorage.setItem("userData", JSON.stringify(data));
      return data;
    }
  } catch (err) {
    console.error("Error fetching user data:", err);
  }
  return null;
}

// Update the KYC UI based on status
function handleKYCStatus(data) {
  const kycStatus = data.kycStatus;

  if (kycStatus === "pending" || kycStatus === "approved") {
    document.getElementById("kycFormContainer").style.display = "none";
    document.getElementById("kycMessageContainer").style.display = "block";

    const messageTitle = kycStatus === "pending" ? "⏳ Under Review" : "✅ KYC Approved";
    const messageText = kycStatus === "pending"
      ? "Your KYC is currently under review by our admin team. Please check back later."
      : "Your KYC has been successfully approved. Thank you for verifying your identity.";

    document.getElementById("kycMessageTitle").innerText = messageTitle;
    document.getElementById("kycMessageText").innerText = messageText;
  } else {
    // No KYC yet – show form
    document.getElementById("kycFormContainer").style.display = "block";
    document.getElementById("kycMessageContainer").style.display = "none";
  }
}

firebaseAuth.onAuthStateChanged(async (currentUser) => {
  document.getElementById("loadingSpinner").style.display = "block";
  document.getElementById("kycFormContainer").style.display = "none";
  document.getElementById("kycMessageContainer").style.display = "none";

  if (!currentUser) {
    showMessage("You must be logged in to submit KYC.", "error");
    setTimeout(() => window.location.href = "login.html", 2000);
    return;
  }

  user = currentUser;

  const cachedData = loadCachedUserData();
  if (cachedData) {
    // 💡 Show cached UI *immediately*
    handleKYCStatus(cachedData);
    document.getElementById("loadingSpinner").style.display = "none";
  }

  const savedStep = parseInt(localStorage.getItem("kycStep")) || 1;
  showStep(savedStep);

  const freshData = await fetchAndCacheUserData(user.uid);

  if (freshData) {
    handleKYCStatus(freshData);
  }

  document.getElementById("loadingSpinner").style.display = "none";
});

async function submitKYC() {
  const submitBtn = document.getElementById("submitBtn");
  const fullName = document.getElementById("fullName").value.trim();
  const country = document.getElementById("country").value.trim();
  const dob = document.getElementById("dob").value;
  const idType = document.getElementById("idType").value;
  const idNumber = document.getElementById("idNumber").value.trim();
  const idImageInput = document.getElementById("idImage");
  const idImageFile = idImageInput.files[0];

  if (!fullName || !country || !dob || !idType || !idNumber || !idImageFile) {
    showMessage("❗ Please fill out all fields and upload an ID image.", "error");
    return;
  }

  if (!user) {
    showMessage("❗ You are not logged in.", "error");
    return;
  }

  showMessage("📤 Uploading ID image...");
  submitBtn.disabled = true;

  try {
    const imageUrl = await uploadImageToCloudinary(idImageFile); // Upload image

    showMessage("📬 Submitting your KYC...");

    const payload = {
      email: user.email,
      fullName,
      country,
      dob,
      idType,
      idNumber,
      idImageUrl: imageUrl, // 🔥 Save image URL here
      kycStatus: "pending",
      kycSubmittedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    await firebaseDB.collection("users").doc(user.uid).set(payload, { merge: true });

    const updatedData = { ...(loadCachedUserData() || {}), ...payload };
    localStorage.setItem("userData", JSON.stringify(updatedData));

    showMessage("✅ KYC submitted successfully. Please wait for admin approval.", "success");

    localStorage.removeItem("kycStep");

    document.getElementById("kycFormContainer").style.display = "none";
    document.getElementById("kycMessageContainer").style.display = "block";
    document.getElementById("kycMessageTitle").innerText = "⏳ Under Review";
    document.getElementById("kycMessageText").innerText = "Your KYC is currently under review by our admin team. Please check back later.";

  } catch (err) {
    console.error(err);
    showMessage("❌ Error: " + err.message, "error");
  }

  submitBtn.disabled = false;
}

</script>
<script>

async function uploadImageToCloudinary(file) {
  const cloudName = "dfepzhhbz"; // ⚠️ Replace this
  const uploadPreset = "kyc_unsigned"; // ⚠️ Replace this

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", uploadPreset);

  const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/upload`, {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  if (data.secure_url) {
    return data.secure_url;
  } else {
    throw new Error("Cloudinary upload failed: " + JSON.stringify(data));
  }
}

</script>

<script>
  const idImageInput = document.getElementById("idImage");
  const previewContainer = document.getElementById("imagePreviewContainer");
  const previewImage = document.getElementById("idImagePreview");

  idImageInput.addEventListener("change", function () {
    const file = this.files[0];
    if (file && file.type.startsWith("image/")) {
      const reader = new FileReader();
      reader.onload = function (e) {
        previewImage.src = e.target.result;
        previewContainer.style.display = "block";
      };
      reader.readAsDataURL(file);
    } else {
      previewImage.src = "";
      previewContainer.style.display = "none";
    }
  });
</script>
