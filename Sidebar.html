<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ride App Template</title>

  <!-- Google Fonts + Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
  
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      width: 100%;
      background: green;
      overflow-x: hidden;
    }

   
    nav {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1001;
    }

   nav i {
  font-size: 20px;
  padding: 15px;
  background-color: white;
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(0, 0, 1, 0.2);
  cursor: pointer;
  z-index: 1500;
}

.sidebar {
  position: fixed;
  bottom: -400px;
  left: 0;
  width: 100%;
  height: 400px;
  background-color: black;
  box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
  padding: 10px;
  transition: bottom 0.3s ease;
  z-index: 2000;
border-top-left-radius: 50px;

border-top-right-radius: 50px;

  overflow-y: auto;
}

.sidebar.open {
  bottom: 0;
}

    .menu {
      list-style: none;
      padding: 0;
    }
.menu a {
text-decoration: none;
color: black;
}
    .menu li {
      padding: 12px 0;
      font-size: 16px;
      position: relative;
      cursor: pointer;
    }

    .icon {
      margin-right: 10px;
    }

    /* Backdrop */
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      z-index: 999;
    }

    .overlay.show {
      display: block;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #555;
    }

    .container {
      max-width: 400px;
      margin: 40px auto;
      background: black;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.05);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 24px;
      font-weight: 600;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-size: 14px;
      color: #ccc;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #262626;
      border: 1px solid #333;
      border-radius: 6px;
      color: white;
      font-size: 14px;
      outline: none;
height: 40px;
      transition: border 0.2s ease;
    }

input[type="text"],
    input[type="number"] {
height: 40px;
width: 95%;

transition: border 0.2s ease;
padding: 10px;
background-color: #262626;
      border: 1px solid #333;
      border-radius: 6px;
      color: white;
      font-size: 14px;
      outline: none;

}

    select:focus,
    input:focus {
      border-color: #00ccff;
    }

    .address-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .saved-address {
      color: #00ccff;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
    }

    .amount-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .amount-bar input {
      flex: 1;
    }

    .all-btn {
      background-color: rgba(0, 191, 255, 1);
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      color: #000;
      font-weight: 600;
      font-size: 13px;
      transition: opacity 0.2s ease;
    }

    .all-btn:hover {
      opacity: 0.9;
    }

    .withdraw-btn {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background-color: rgba(0, 191, 255, 1);
      border: none;
      border-radius: 8px;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.3s ease;
    }

    .withdraw-btn:hover {
      background: linear-gradient(90deg, #00ccff, #00ffe7);
    }

    .available-balance {
      font-size: 13px;
      color: #bbb;
      margin-top: 8px;
    }

    .available-balance span {
      color: #00ffe7;
      font-weight: 600;
    }

    @media screen and (max-width: 480px) {
      .container {
        padding: 20px 15px;
        margin: 20px auto;
      }

      h2 {
        font-size: 20px;
      }
    }





nav {
display: flex;
justify-content: center;
align-items: center;
background-color: transparent;
margin-top: 10px;
gap: 25%;

}

nav div {
color: white;
left: 20px;
font-size: 20px;
padding: 0px;
margin-top: -5px;
}
nav h3 {
text-align: center;
font-size: 16px;
color: white;
}

nav a {
color: #ccc;
}



#process {
  max-width: 300px;
  text-align: center;
  margin: -40px auto;
      background: black;
      padding: -30px;
}



h4 {
  margin-top: 10px;
  font-size: 22px;
}

.message {
  font-size: 14px;
  margin: 10px 0 30px;
  color: #ccc;
}

.buttons button {
  width: 100%;
  padding: 15px;
  margin-bottom: 10px;
  border: none;
  font-size: 16px;
  border-radius: 10px;
  cursor: pointer;
}

.primary {
 background-color: rgba(0, 191, 255, 1);
  color: #000;
}

.secondary {
  background-color: rgba(0, 191, 255, 1);
  color: #000;
}

/* === Light Mode Overrides === */
body.light-mode {
  background-color: white;
  color: black;

}

body.light-mode .container,
body.light-mode nav {
  background-color: white !important;
  color: black;

}

body.light-mode nav h3, body.light-mode nav a{
color: black;
}

body.light-mode label,
body.light-mode .message {
  color: grey !important;
}

body.light-mode select,
body.light-mode input[type="text"],
body.light-mode input[type="number"] {
  background-color: #f0f0f0;
  color: #000;

  border: none;
}

body.light-mode .available-balance span {
  color: #007acc;
}

body.light-mode .all-btn, body.light-mode .tonWithdrawal,
body.light-mode .withdraw-btn,
body.light-mode .primary,
body.light-mode .secondary {
  background-color: black !important;
  color: white !important;
}

.tonWithdrawal {
    background-color: rgba(0, 191, 255, 1);
  padding: 10px 15px;
  border-radius: 10px;
  margin-top: 10px;
width: 100%;
font-size: 16px;
color: black;
border: 0px;
text-align: center
}

  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <i class="fas fa-bars" id="menuToggle"></i>
  </nav>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">

<div class="container">

  <!-- Process message (initially hidden) -->

    <label for="address">
      TON Address:
    </label>
    <input type="text" id="address" placeholder="Enter Address" required />

    <label for="amount">Withdrawal Amount:</label>
    <div class="amount-bar">
      <input type="number" id="amount" placeholder="Enter Amount" />
      <button class="all-btn" onclick="setMaxAmount()">ALL</button>
    </div>

    <div class="available-balance">
      Available Balance: <span id="available-balance">0.00</span> USDT
    </div>

<div id="gas-fee" style="display: none; margin-top: 10px; font-size: 14px; color: grey;">
  ⚡ Network Gas Fee: <strong>1 TON</strong>

     <button onclick="buyProduct()" class="tonWithdrawal">Send
</button>

</div>

  </div>

  <!-- Success message -->
 <p id="success-msg"></p>

</div>

  </div>









  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Script -->
  <script>
    const menuToggle = document.getElementById("menuToggle");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");

    menuToggle.addEventListener("click", () => {
      sidebar.classList.add("open");
      overlay.classList.add("show");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("show");
    });
  </script>





<script src="theme-toggle.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Firebase Config -->
  <script src="firebaseDetails.js"></script>

<script>
  let maxBalance = 0;
  let user = null;

  const amountInput = document.getElementById("amount");
  const availableBalanceDisplay = document.getElementById("available-balance");

  function loadCachedBalance() {
    const cached = localStorage.getItem("userData");
    if (!cached) return;
    try {
      const data = JSON.parse(cached);
      maxBalance = parseFloat(data?.fundingBalance || 0);
      updateAvailableBalanceDisplay(maxBalance);
    } catch (e) {
      console.warn("Could not parse cached user data:", e);
    }
  }

  function updateAvailableBalanceDisplay(balance) {
    if (balance < 0) balance = 0;
    availableBalanceDisplay.textContent = balance.toFixed(2);
  }

  loadCachedBalance();

  firebaseAuth.onAuthStateChanged(async (currentUser) => {
    if (currentUser) {
      user = currentUser;
      try {
        const doc = await firebaseDB.collection("users").doc(user.uid).get();
        if (doc.exists) {
          const userData = doc.data();
          maxBalance = parseFloat(userData?.fundingBalance || 0);
          updateAvailableBalanceDisplay(maxBalance);
          const cached = localStorage.getItem("userData");
          let updatedData = {};
          try { updatedData = cached ? JSON.parse(cached) : {}; } catch {}
          localStorage.setItem("userData", JSON.stringify({
            ...updatedData,
            fundingBalance: maxBalance
          }));
        }
      } catch (error) {
        console.error("Error fetching user balance:", error);
      }
    }
  });

  amountInput.addEventListener("input", () => {
    const typedAmount = parseFloat(amountInput.value) || 0;
    if (typedAmount > maxBalance) {
      availableBalanceDisplay.textContent = "Insufficient funds";
      // Optionally style it differently:
      availableBalanceDisplay.style.color = "#ff5555";
    } else {
      const remaining = maxBalance - typedAmount;
      availableBalanceDisplay.style.color = ""; // reset
      updateAvailableBalanceDisplay(remaining);
    }

    const gasFeeDiv = document.getElementById("gas-fee");
    if (typedAmount > 0) {
      gasFeeDiv.style.display = "block";
    } else {
      gasFeeDiv.style.display = "none";
    }
  });

  function setMaxAmount() {
    amountInput.value = maxBalance;
    updateAvailableBalanceDisplay(0);
    const gasFeeDiv = document.getElementById("gas-fee");
    gasFeeDiv.style.display = "block";
  }

  async function confirmPayment() {
    if (!user) {
      alert("You must be logged in.");
      return;
    }
    const address = document.getElementById("address").value.trim();
    const amount = parseFloat(amountInput.value);
    const email = user.email;

    if (!address) {
      alert("Please enter your Tron address before confirming.");
      return;
    }
    if (!amount || isNaN(amount) || amount <= 0) {
      alert("Please enter a valid amount.");
      return;
    }
    if (amount > maxBalance) {
      alert("Insufficient funds.");
      return;
    }

    try {
      // Deduct balance immediately
      const newBalance = maxBalance - amount;
      await firebaseDB.collection("users").doc(user.uid).update({
        fundingBalance: newBalance
      });
      maxBalance = newBalance;
      updateAvailableBalanceDisplay(maxBalance);
      const cached = localStorage.getItem("userData");
      let updatedData = {};
      try { updatedData = cached ? JSON.parse(cached) : {}; } catch {}
      updatedData.fundingBalance = maxBalance;
      localStorage.setItem("userData", JSON.stringify(updatedData));

      // Create withdrawal request
      await firebaseDB.collection("withdrawals").add({
        userId: user.uid,
        email: email,
        address: address,
        amount: amount,
        currency: "USDT",        // adjust if needed
        method: "TON",          // adjust if needed
        status: "in_progress",  // mark as in progress
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        expiryAt: firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 24 * 60 * 60 * 1000))
      });

      // Redirect user
      window.location.href = "successfully.html";
    } catch (error) {
      console.error("Payment confirmation failed:", error);
      alert("Something went wrong. Please try again.");
    }
  }

  function buyProduct() {
    const merchantAddress = 'UQB0DROMcjxjRK7Hh‑vlz‑JngAEYv7wCAy3ktn0EX8OvJZ8D';
    const amountTon = 1;  // ensure this matches your minimum
    const message = 'Withdrawal payment';

    const typedAmount = parseFloat(amountInput.value) || 0;
    if (typedAmount > maxBalance) {
      alert("Insufficient funds.");
      return;
    }
    if (typedAmount < amountTon) {
      alert(`You must send at least ${amountTon} TON.`);
      return;
    }

    const url = `ton://transfer/${merchantAddress}?amount=${amountTon}&text=${encodeURIComponent(message)}`;
    window.location.href = url;

    setTimeout(() => {
      const gasFeeDiv = document.getElementById("gas-fee");
      gasFeeDiv.innerHTML = `
        <p style="color: #ccc; font-size: 14px; margin-bottom: 15px;">
          If your TON wallet didn’t open, please send <strong>${amountTon} TON</strong> manually to:<br/><br/>
          <strong style="color: #00ccff;">${merchantAddress}</strong> to process your withdrawal 
        </p>
        <button class="tonWithdrawal" onclick="confirmPayment()">I have paid</button>
      `;
      gasFeeDiv.style.display = "block";
    }, 2000);
  }
</script>

</body>
</html>
