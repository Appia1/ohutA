  function log(msg) {
    console.log(msg);
    if (debug) {
      debug.textContent += typeof msg === "string" ? `\n${msg}` : `\n${JSON.stringify(msg, null, 2)}`;
      debug.scrollTop = debug.scrollHeight;
    }
  }

  function formatDate(timestamp) {
    try {
      return timestamp.toDate().toLocaleString();
    } catch {
      return "Unknown time";
    }
  }

function getCacheKey(user) {
  return "messages_" + user.uid;
}

function renderMessages(messages) {

    container.innerHTML = "";

    if (!messages.length) {
        container.innerHTML =
            '<p class="empty-state">No messages yet.</p>';
        return;
    }

    messages.forEach(data => {

        const div = document.createElement("div");
        div.className = "message";

        const type = document.createElement("div");
        type.className = "message-type";
        type.textContent =
            data.to === "all"
            ? "📢 Broadcast Message"
            : "📩 Private Message";

        const text = document.createElement("div");
        text.className = "message-text";
        text.textContent = data.message || "(No content)";

        const time = document.createElement("div");
        time.className = "timestamp";
        time.textContent = data.timestamp
            ? formatDate(data.timestamp)
            : "Unknown time";

        div.appendChild(type);
        div.appendChild(text);
        div.appendChild(time);

        container.appendChild(div);

    });

}

  window.onerror = function(message, source, lineno, colno, error) {
    log(`❌ Global error: ${message} at ${source}:${lineno}:${colno}`);
    if (error && error.stack) log(error.stack);
  };

  window.onunhandledrejection = function(event) {
    log(`❌ Unhandled promise rejection: ${event.reason}`);
    if (event.reason && event.reason.stack) log(event.reason.stack);
  };

  firebaseAuth.onAuthStateChanged((user) => {
    if (!container) {
      log("❌ #messages-container not found in HTML.");
      return;
    }

    if (user) {
      log(`✅ Logged in as: ${user.email}`);

const cacheKey = getCacheKey(user);

const cachedMessages = JSON.parse(
  localStorage.getItem(cacheKey) || "[]"
);

if (cachedMessages.length) {
  renderMessages(cachedMessages);
}

      const db = firebaseDB;
      const messagesRef = db.collection("messages")
        .where("to", "in", [user.email, "all"])
        .orderBy("timestamp", "desc");

unsubscribe = messagesRef.onSnapshot(snapshot => {

    const messages = [];

    snapshot.forEach(doc => {
        messages.push({
            ...doc.data()
        });
    });

    localStorage.setItem(
        cacheKey,
        JSON.stringify(messages)
    );

    renderMessages(messages);

}, error => {

    log("❌ onSnapshot error: " + error.message);

    container.innerHTML =
        '<p class="empty-state">Failed to load messages.</p>';

});


    } else {
      log("⚠️ User not logged in.");
      container.innerHTML = '<p class="empty-state">You are not signed in.</p>';
    }
  });

window.addEventListener("beforeunload", () => {
    if (unsubscribe) {
        unsubscribe();
    }
});
