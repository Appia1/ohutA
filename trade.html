<script>

document.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  const isLight = savedTheme === 'light';

  if (isLight) {
    document.body.classList.add('light-mode');
  }

  // Wait for TradingView script to load before using it
  const waitForTV = setInterval(() => {
    if (window.TradingView) {
      createTradingViewWidget(isLight ? 'light' : 'dark');
      clearInterval(waitForTV);
    }
  }, 100);

  const toggleBtn = document.getElementById('toggle-theme');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');

      const isLightNow = document.body.classList.contains('light-mode');
      localStorage.setItem('theme', isLightNow ? 'light' : 'dark');

      // Re-create widget with updated theme
      createTradingViewWidget(isLightNow ? 'light' : 'dark');
    });
  }
});


</script>

<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const tradeBtn = document.getElementById("tradeBtn");
const statusDiv = document.getElementById("status");
const balanceDiv = document.getElementById("balance");
const timerDiv = document.getElementById("timer");

let currentUser = null;
let userDocRef = null;
let balance = 0.00;
let tradeSignals = [];
let tradeIndex = 0;
let tradesLastHour = [];
let activeTrade = false;
let gracePeriodTimer = null;
let activeTradeInterval = null;
let nextTradeWindow = null;
let tradeInProgressStartTime = null;
let currentTradeAmount = null;
let lastOrderId = null;
let lastDirection = null;
let gracePeriodEndTime = null;
let tradeUsedInGrace = false;

// --- AUTH ---
auth.signInAnonymously().catch(console.error);

auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    userDocRef = db.collection("users").doc(user.uid);

    userDocRef.get().then(doc => {
      const now = Date.now();

      if (doc.exists) {
        const data = doc.data();
        balance = parseFloat(data.tradingBalance) || 0;
        tradeSignals = data.tradeSignals ?? generateAndStoreSignals();
        tradeIndex = data.tradeIndex ?? 0;
        tradesLastHour = data.tradeTimestamps ?? [];
        nextTradeWindow = data.nextTradeWindow ?? now;
        gracePeriodEndTime = data.gracePeriodEndTime ?? null;
        tradeUsedInGrace = data.tradeUsedInGrace ?? false;
        activeTrade = data.activeTrade ?? false;
        tradeInProgressStartTime = data.tradeInProgressStartTime ?? null;
        currentTradeAmount = data.currentTradeAmount ?? null;
        lastOrderId = data.lastOrderId ?? null;
        lastDirection = data.lastDirection ?? null;

        updateBalanceDisplay();
        cleanTradeTimestamps();

        // 🧩 Check if a previous trade expired while user was away
        checkAndFinalizeTradeOnLoad(data);

        // Resume or continue the normal cycle
        if (activeTrade && tradeInProgressStartTime) {
          resumeActiveTrade();
        } else if (gracePeriodEndTime && now < gracePeriodEndTime && !tradeUsedInGrace) {
          startGracePeriod(nextTradeWindow);
        } else {
          const startTime = (nextTradeWindow && nextTradeWindow > now) ? nextTradeWindow : now;
          startGracePeriod(startTime);
        }

      } else {
        // --- New user setup ---
        const now = Date.now();
        balance = 0.00;
        tradeSignals = generateAndStoreSignals();
        tradeIndex = 0;
        tradesLastHour = [];
        nextTradeWindow = now;
        gracePeriodEndTime = now + 2 * 60 * 1000;
        tradeUsedInGrace = false;
        activeTrade = false;

        userDocRef.set({
          tradingBalance: balance,
          tradeSignals,
          tradeIndex,
          tradeTimestamps: [],
          nextTradeWindow,
          gracePeriodEndTime,
          tradeUsedInGrace,
          activeTrade: false,
          tradeInProgressStartTime: null,
          currentTradeAmount: null,
          lastOrderId: null,
          lastDirection: null
        }, { merge: true });

        updateBalanceDisplay();
        startGracePeriod(nextTradeWindow);
      }
    });
  } else {
    statusDiv.textContent = "⚠️ Not signed in.";
  }
});

// --- UI Updates ---
function updateBalanceDisplay() {
  balanceDiv.textContent = `$${balance.toFixed(2)} `;
  const tradeAmount = balance * 0.05;
  document.getElementById("tradeAmountPreview").textContent =
    `$${tradeAmount.toFixed(2)}`;
}

// --- Utilities ---
function generateAndStoreSignals() {
  const results = Array(10).fill("lose");
  let winCount = 0;
  while (winCount < 7) {
    const i = Math.floor(Math.random() * 10);
    if (results[i] === "lose") {
      results[i] = "win";
      winCount++;
    }
  }
  if (userDocRef) userDocRef.set({ tradeSignals: results }, { merge: true });
  return results;
}

function cleanTradeTimestamps() {
  const now = Date.now();
  tradesLastHour = tradesLastHour.filter(t => now - t < 60 * 60 * 1000);
}

function isTradeAllowed() {
  cleanTradeTimestamps();
  const now = Date.now();
  const tradesLast10Min = tradesLastHour.filter(t => now - t < 10 * 60 * 1000);
  return tradesLastHour.length < 10 && tradesLast10Min.length < 2;
}

function generateOrderId() {
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const prefix = letters[Math.floor(Math.random() * 26)] + letters[Math.floor(Math.random() * 26)];
  const numbers = Date.now().toString().padEnd(18, '0').slice(0, 18);
  return prefix + numbers;
}

function getRandomDirection() {
  return Math.random() < 0.5 ? 'buy' : 'sell';
}

// --- Place Trade ---
function placeTrade() {
  const now = Date.now();
  if (!isTradeAllowed() || activeTrade || tradeIndex >= tradeSignals.length || tradeUsedInGrace) {
    statusDiv.innerHTML = "⛔ Trade not allowed now.";
    return;
  }

  if (now > gracePeriodEndTime) {
    statusDiv.innerHTML = "⌛ Signal period over — wait for next window.";
    tradeBtn.disabled = true;
    return;
  }

  if (balance <= 0 || isNaN(balance)) {
    statusDiv.innerHTML = "🚫 Insufficient balance. Please fund your account.";
    tradeBtn.disabled = true;
    return;
  }

  const originalBalance = balance;
  const tradeAmount = originalBalance * 0.05;
  const orderId = generateOrderId();
  const direction = getRandomDirection();

  balance -= tradeAmount;
  updateBalanceDisplay();

  activeTrade = true;
  document.getElementById("tradeSound").play().catch(console.error);
  tradeBtn.disabled = true;
  tradesLastHour.push(now);

  nextTradeWindow = now + 10 * 60 * 1000;
  gracePeriodEndTime = null;
  tradeUsedInGrace = true;

  tradeInProgressStartTime = now;
  currentTradeAmount = tradeAmount;
  lastOrderId = orderId;
  lastDirection = direction;

  // Save immediately in case user closes tab
  userDocRef.set({
    tradeUsedInGrace: true,
    gracePeriodEndTime: null,
    activeTrade: true,
    tradeInProgressStartTime: now,
    currentTradeAmount: tradeAmount,
    lastOrderId: orderId,
    lastDirection: direction
  }, { merge: true });

  saveTradeData(orderId, direction);
  activeTradeCountdown(60 * 1000, tradeAmount, orderId, direction, originalBalance);

  statusDiv.innerHTML = `📈 Trade placed. Waiting 60 seconds...<br>📄 Order ID: <strong>${orderId}</strong><br>📍Direction: <strong>${direction.toUpperCase()}</strong>`;
}

// --- Countdown & Result ---
function activeTradeCountdown(duration, tradeAmount, orderId, direction, originalBalance) {
  if (activeTradeInterval) clearInterval(activeTradeInterval);
  let remaining = Math.floor(duration / 1000);

  timerDiv.textContent = `⏱️ Trade result in: ${remaining}s`;

  activeTradeInterval = setInterval(() => {
    remaining--;
    if (remaining > 0) {
      timerDiv.textContent = `⏱️ Trade result in: ${remaining}s`;
    } else {
      clearInterval(activeTradeInterval);
      timerDiv.textContent = "";
      finishTrade(tradeAmount, orderId, direction, originalBalance);
    }
  }, 1000);
}

// --- Finalize Trade ---
function finishTrade(tradeAmount, orderId, direction, originalBalance) {
  const result = tradeSignals[tradeIndex];
  tradeIndex++;

  if (tradeIndex >= tradeSignals.length) {
    tradeSignals = generateAndStoreSignals();
    tradeIndex = 0;
  }

  let profit = 0;
  if (result === "win") {
    profit = originalBalance * 0.12;
    balance += profit;
  } else {
    balance -= tradeAmount;
  }

  updateBalanceDisplay();

  // Save to trade history
  db.collection("users")
    .doc(auth.currentUser.uid)
    .collection("tradeHistory")
    .add({
      orderId,
      direction,
      currency: "BTC/USDT",
      openTime: tradeInProgressStartTime,
      closeTime: Date.now(),
      profit: result === "win" ? profit : -tradeAmount,
      result,
      balance,
      type: "Master Signal"
    })
    .then(() => console.log("✅ Auto trade saved:", orderId))
    .catch(err => console.error("❌ Error saving trade:", err));

  // Update Firestore balance & trade state
  userDocRef.set({
    tradingBalance: balance,
    lastOrderId: orderId,
    lastDirection: direction,
    tradeIndex,
    activeTrade: false,
    tradeInProgressStartTime: null,
    currentTradeAmount: null,
  }, { merge: true });

  // UI result
  statusDiv.innerHTML = `
    📄 Order ID: <strong>${orderId}</strong><br/>
    📍 Direction: <strong>${direction.toUpperCase()}</strong><br/>
    ${
      result === "win"
        ? `✅ Trade Result: <strong>WIN</strong> 🎉 → +$${profit.toFixed(2)}`
        : `❌ Trade Result: <strong>LOSS</strong> → -$${tradeAmount.toFixed(2)}`
    }
  `;

  activeTrade = false;
  tradeInProgressStartTime = null;
  currentTradeAmount = null;
  scheduleNextTradeCycle();
}

// --- Resume or Auto-Finalize if Expired ---
function resumeActiveTrade() {
  const now = Date.now();
  const elapsed = now - tradeInProgressStartTime;

  if (elapsed < 60 * 1000) {
    const remaining = 60 * 1000 - elapsed;
    tradeBtn.disabled = true;
    activeTradeCountdown(remaining, currentTradeAmount, lastOrderId, lastDirection, balance);
  } else {
    console.log("💡 Trade expired while user was away — finishing now...");
    finishTrade(currentTradeAmount, lastOrderId, lastDirection, balance);
  }
}

// 🧩 Detect and finalize any unfinished trade when user returns
function checkAndFinalizeTradeOnLoad(data) {
  const now = Date.now();
  if (!data.tradeInProgressStartTime) return;

  const start = data.tradeInProgressStartTime;
  const duration = 60 * 1000;
  const end = start + duration;

  if (now >= end && data.activeTrade) {
    console.log("💡 Detected unfinished trade — finalizing...");
    currentTradeAmount = data.currentTradeAmount;
    lastOrderId = data.lastOrderId;
    lastDirection = data.lastDirection;
    balance = data.tradingBalance || 0;
    finishTrade(currentTradeAmount, lastOrderId, lastDirection, balance);
  }
}

// --- Grace Period ---
function startGracePeriod(startTime) {
  if (gracePeriodTimer) clearInterval(gracePeriodTimer);
  if (activeTradeInterval) clearInterval(activeTradeInterval);

  const now = Date.now();
  const graceEnd = startTime + 2 * 60 * 1000;

  nextTradeWindow = startTime;
  gracePeriodEndTime = graceEnd;
  tradeUsedInGrace = false;

  userDocRef.set({
    nextTradeWindow,
    gracePeriodEndTime,
    tradeUsedInGrace: false
  }, { merge: true });

  gracePeriodTimer = setInterval(() => {
    const now = Date.now();
    const allowed = isTradeAllowed();

    if (activeTrade || !allowed || tradeIndex >= tradeSignals.length) {
      tradeBtn.disabled = true;
      clearInterval(gracePeriodTimer);
      timerDiv.textContent = "⛔ Cannot trade now";
      return;
    }

    if (now < startTime) {
      tradeBtn.disabled = true;
      const remaining = Math.floor((startTime - now) / 1000);
      timerDiv.textContent = `⏳ Next signal in: ${remaining}s`;
    } else if (now <= graceEnd && !tradeUsedInGrace) {
      tradeBtn.disabled = false;
      const remaining = Math.floor((graceEnd - now) / 1000);
      timerDiv.textContent = `✅ Signal period: ${remaining}s`;
    } else {
      tradeBtn.disabled = true;
      timerDiv.textContent = "⌛ Grace period over — wait for next window";
      clearInterval(gracePeriodTimer);
    }
  }, 1000);
}

// --- Save Trade Data ---
function saveTradeData(orderId = null, direction = null) {
  if (!userDocRef) return;
  const data = {
    tradingBalance: balance,
    tradeIndex,
    tradeTimestamps: tradesLastHour,
    nextTradeWindow,
    gracePeriodEndTime,
    tradeUsedInGrace,
    activeTrade,
    tradeInProgressStartTime,
    currentTradeAmount,
  };
  if (orderId) data.lastOrderId = orderId;
  if (direction) data.lastDirection = direction;

  userDocRef.set(data, { merge: true }).catch(err => {
    console.error("Error saving trade data:", err);
  });
}

// --- Schedule Next Cycle ---
function scheduleNextTradeCycle() {
  const now = Date.now();
  nextTradeWindow = now + 10 * 60 * 1000;
  gracePeriodEndTime = nextTradeWindow + 2 * 60 * 1000;

  userDocRef.set({
    nextTradeWindow,
    gracePeriodEndTime,
    tradeUsedInGrace: false
  }, { merge: true });

  const delay = nextTradeWindow - now;

  setTimeout(() => {
    startGracePeriod(nextTradeWindow);
    setTimeout(() => {
      scheduleNextTradeCycle();
    }, 2 * 60 * 1000);
  }, delay);
}

// --- Loader UI ---
function showLoader() {
  document.getElementById('loader').style.display = 'block';
  document.getElementById('overlay').style.display = 'block';
}
function hideLoader() {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('overlay').style.display = 'none';
}
function fetchData() {
  showLoader();
  setTimeout(() => {
    console.log("Data fetched from database!");
    hideLoader();
    document.getElementById("content").innerHTML += "<p><strong>Data loaded!</strong></p>";
  }, 3000);
}
window.addEventListener('load', fetchData);
</script>

<script>
// === Manual Trade Section Elements ===
const buyBtn = document.getElementById("buyBtn");
const sellBtn = document.getElementById("sellBtn");
const riskSlider = document.getElementById("riskSlider");
const riskValue = document.getElementById("riskValue");
const manualTimer = document.getElementById("manualTimer");
const manualStatus = document.getElementById("manualStatus");

// === Manual Trade Variables ===
let manualTradeActive = false;
let manualTradeInterval = null;

// === Handle Manual Trade Start ===
function handleManualTrade(direction) {
  if (manualTradeActive) {
    manualStatus.innerHTML = "⚠️ Trade already running!";
    return;
  }

  const now = Date.now();
  const orderId = generateOrderId();
  const riskPercent = parseFloat(riskSlider.value);
  const amount = balance * (riskPercent / 100);

  if (amount <= 0 || balance < amount) {
    manualStatus.innerHTML = "🚫 Insufficient balance or invalid amount.";
    return;
  }

  // Deduct balance for trade
  balance -= amount;
  updateBalanceDisplay();
  updateManualBalance();
  manualTradeActive = true;

  // 🔊 Play sound for manual trade (NEW)
  document.getElementById("tradeSound").play().catch(console.error);

  // Save trade to Firestore (activeTrades + user doc)
  db.collection("users")
    .doc(auth.currentUser.uid)
    .collection("activeTrades")
    .doc(orderId)
    .set({
      orderId,
      direction,
      openTime: now,
      duration: 120000, // 2 minutes
      endTime: now + 120000,
      amount,
      balanceAtStart: balance + amount,
      active: true,
    })
    .catch(console.error);

  userDocRef
    .set(
      {
        manualTrade: {
          orderId,
          direction,
          amount,
          startTime: now,
          duration: 120000,
          active: true,
        },
        tradingBalance: balance,
      },
      { merge: true }
    )
    .catch(console.error);

  startManualCountdown(orderId, direction, amount, now, 120000);
}

// === Start or Resume Manual Countdown ===
function startManualCountdown(orderId, direction, amount, startTime, duration) {
  if (manualTradeInterval) clearInterval(manualTradeInterval);

  const tradeEndTime = startTime + duration;
  manualTradeActive = true;

  manualStatus.innerHTML = `
    📄 Order ID: <strong>${orderId}</strong><br>
    📍 Direction: <strong>${direction.toUpperCase()}</strong><br>
    🕒 Trade in progress — closing in <strong>2 minutes</strong>...
  `;

  manualTradeInterval = setInterval(() => {
    const now = Date.now();
    const remaining = Math.max(0, Math.floor((tradeEndTime - now) / 1000));
    const minutes = Math.floor(remaining / 60);
    const seconds = remaining % 60;

    manualTimer.textContent = `⏱️ Time Remaining: ${minutes}:${seconds
      .toString()
      .padStart(2, "0")}`;

    if (remaining <= 0) {
      clearInterval(manualTradeInterval);
      finishManualTrade(orderId, direction, amount);
    }
  }, 1000);
}

// === Finish Manual Trade ===
function finishManualTrade(orderId, direction, amount) {
  const now = Date.now();
  const openTime = now - 120000;
  const result = Math.random() < 0.5 ? "win" : "lose";
  let profit = 0;

  if (result === "win") {
    profit = amount * 0.8;
    balance += amount + profit;
  }

  updateBalanceDisplay();
  updateManualBalance();

  db.collection("users")
    .doc(auth.currentUser.uid)
    .collection("tradeHistory")
    .add({
      orderId,
      direction,
      balance,
      currency: "BTC/USDT",
      openTime,
      closeTime: now,
      profit: result === "win" ? profit : -amount,
      result,
      type: "User Signal"
    })
    .then(() => console.log("✅ Manual trade saved to history:", orderId))
    .catch(console.error);

  db.collection("users")
    .doc(auth.currentUser.uid)
    .collection("activeTrades")
    .doc(orderId)
    .delete()
    .catch(console.error);

  if (userDocRef) {
    userDocRef.set({
      tradingBalance: balance,
      manualTrade: firebase.firestore.FieldValue.delete(),
    }, { merge: true }).catch(console.error);
  }

  manualStatus.innerHTML = `
    📄 Order ID: <strong>${orderId}</strong><br>
    📍 Direction: <strong>${direction.toUpperCase()}</strong><br>
    ${
      result === "win"
        ? `✅ Trade Result: <strong>WIN</strong> 🎉 +$${profit.toFixed(2)}`
        : `❌ Trade Result: <strong>LOSS</strong> -$${amount.toFixed(2)}`
    }
  `;
  manualTimer.textContent = "";
  manualTradeActive = false;
}

// === Resume Manual Trade After Refresh ===
function resumeManualTrade(trade) {
  const { orderId, direction, amount, startTime, duration } = trade;
  const elapsed = Date.now() - startTime;
  const remaining = duration - elapsed;

  if (remaining <= 0) {
    finishManualTrade(orderId, direction, amount);
    return;
  }

  startManualCountdown(orderId, direction, amount, startTime, duration);
}

// === Restore Active Trade on Page Load ===
auth.onAuthStateChanged((user) => {
  if (!user) return;
  const ref = db.collection("users").doc(user.uid);
  ref.get().then((doc) => {
    if (!doc.exists) return;
    const data = doc.data();

    if (data.manualTrade && data.manualTrade.active) {
      const trade = data.manualTrade;
      const now = Date.now();
      const endTime = trade.startTime + trade.duration;

      if (now >= endTime) {
        finishManualTrade(trade.orderId, trade.direction, trade.amount);
      } else {
        resumeManualTrade(trade);
      }
    }
  });
});

// === Local Storage for Risk Slider Memory ===
const savedRisk = localStorage.getItem("manualRiskPercent");
if (savedRisk) {
  riskSlider.value = savedRisk;
}
riskSlider.addEventListener("input", () => {
  const amount = balance * (riskSlider.value / 100);
  riskValue.textContent = `$${amount.toFixed(2)}`;
  localStorage.setItem("manualRiskPercent", riskSlider.value);
});

// === Manual UI Update Function ===
function updateManualBalance() {
  const amount = balance * (riskSlider.value / 100);
  riskValue.textContent = `$${amount.toFixed(2)}`;
}

// === Event Listeners ===
buyBtn.addEventListener("click", () => handleManualTrade("buy"));
sellBtn.addEventListener("click", () => handleManualTrade("sell"));

// === Save Balance on Page Close ===
window.addEventListener("beforeunload", () => {
  if (userDocRef && !isNaN(balance)) {
    userDocRef.set({ tradingBalance: balance }, { merge: true });
  }
});
</script>

</body>
</html>
