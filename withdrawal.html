 <nav class="navbar">

<div class="container">

  <!-- Process message (initially hidden) -->
  <div id="process" style="display: none;">
    
 
   
    <div class="image-container">
      <img src="with.png" alt="Withdrawal">
    </div>

    <h4>Your funds are on the way!</h4>
    <p class="message">
      Your withdrawal is currently under review. We will notify you once your funds have been successfully processed.
    </p>

    <div class="buttons">
      <a href="withdrawalHistory.html"><button class="primary">Check in History</button> </a>
    
    </div>
  
  </div>

  <!-- Wrap the form inside its own container -->
  <div id="withdrawal-form">
    <label for="currency">Currency</label>
    <select id="currency">
      <option>USDT</option>
    </select>

    <label for="method">Withdrawal Method</label>
    <select id="method">
      <option>Tron (TRC-20)</option>
    </select>

    <label for="address">
      Address <!--<span class="saved-address" onclick="loadSavedAddress()">Saved Address</span>-->
    </label>
    <input type="text" id="address" placeholder="Enter Address" required />

    <label for="amount">Withdrawal Amount</label>
    <div class="amount-bar">
      <input type="number" id="amount" placeholder="Enter Amount" />
      <button class="all-btn" onclick="setMaxAmount()">ALL</button>
    </div>

    <div class="available-balance">
      Available Balance: <span id="available-balance">0.00</span> USDT
    </div>

    <button class="withdraw-btn" onclick="withdraw()">Withdraw <span id="lockWith" style="float: right;">🔒</span></button>
  </div>

 <p id="success-msg"></p>

<script src="theme-toggle.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Firebase Config -->
  <script src="firebaseDetails.js"></script>

<script>
  let maxBalance = 0;
  let user = null;

  const amountInput = document.getElementById("amount");
  const availableBalanceDisplay = document.getElementById("available-balance");
  const successMsg = document.getElementById("success-msg"); // <p> element for messages

  // 💾 Load from localStorage (cached userData)
  function loadCachedBalance() {
    const cached = localStorage.getItem("userData");
    if (!cached) return;

    try {
      const data = JSON.parse(cached);
      maxBalance = parseFloat(data?.fundingBalance || 0);
      updateAvailableBalance(maxBalance);
    } catch (e) {
      console.warn("Could not parse cached user data:", e);
    }
  }

  // 🧠 Update balance UI
  function updateAvailableBalance(balance) {
    availableBalanceDisplay.textContent = balance.toFixed(2);
  }

  // 📦 Load from cache first
  loadCachedBalance();

  // 🔐 Firebase auth state
  firebaseAuth.onAuthStateChanged(async (currentUser) => {
    if (currentUser) {
      user = currentUser;

      try {
        const doc = await firebaseDB.collection("users").doc(user.uid).get();

        if (doc.exists) {
          const userData = doc.data();
          maxBalance = parseFloat(userData?.fundingBalance || 0);
          updateAvailableBalance(maxBalance);

          // 🔄 Update cache with latest Firestore data
          const cached = localStorage.getItem("userData");
          let updatedData = {};

          try {
            updatedData = cached ? JSON.parse(cached) : {};
          } catch {
            updatedData = {};
          }

          localStorage.setItem("userData", JSON.stringify({
            ...updatedData,
            fundingBalance: maxBalance
          }));
        }
      } catch (error) {
        console.error("Error fetching user balance:", error);
      }
    }
  });

  // ⌨️ Input event: update balance preview
  amountInput.addEventListener("input", () => {
    const typedAmount = parseFloat(amountInput.value) || 0;
    const remaining = maxBalance - typedAmount;
    updateAvailableBalance(remaining >= 0 ? remaining : 0);
  });

  // 🧮 Max amount
  function setMaxAmount() {
    amountInput.value = maxBalance;
    updateAvailableBalance(0);
  }

  // 🏦 Withdraw

async function withdraw() {
  const address = document.getElementById('address').value.trim();
  const amount = parseFloat(amountInput.value);
  const currency = document.getElementById('currency').value;
  const method = document.getElementById('method').value;

  successMsg.textContent = "";

  if (!user) {
    alert("You must be logged in to withdraw.");
    return;
  }

  if (!address || !amount || isNaN(amount) || amount <= 0) {
    alert("Please enter a valid address and amount.");
    return;
  }

  if (amount > maxBalance) {
    alert("Insufficient balance.");
    return;
  }

  try {
    // Add withdrawal request
    await firebaseDB.collection("withdrawals").add({
      userId: user.uid,
      email: user.email,
      address,
      amount,
      currency,
      method,
      status: "pending",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // Update user balance in Firestore
    maxBalance -= amount;
    await firebaseDB.collection("users").doc(user.uid).update({
      fundingBalance: maxBalance
    });

    // Update localStorage
    const cached = localStorage.getItem("userData");
    let updatedData = {};
    try {
      updatedData = cached ? JSON.parse(cached) : {};
    } catch {
      updatedData = {};
    }

    updatedData.fundingBalance = maxBalance;
    localStorage.setItem("userData", JSON.stringify(updatedData));

    // Clear inputs
    document.getElementById('address').value = "";
    amountInput.value = "";

    updateAvailableBalance(maxBalance);

    // Optional: Show processing UI (if needed)
    const processDiv = document.getElementById("process");
    const withdrawalForm = document.getElementById("withdrawal-form");
    if (processDiv) processDiv.style.display = "block";
    if (withdrawalForm) withdrawalForm.style.display = "none";

    // ✅ REDIRECT TO SUCCESS PAGE
    window.location.href = "successfully.html";

  } catch (error) {
    console.error("Withdrawal Error:", error);
    alert("Error sending request. Try again.");
  }
}

  // 📦 Placeholder for loading saved address
  function loadSavedAddress() {
    alert("Load saved address feature not implemented.");
  }
</script>

<script>
  const lockIcon = document.getElementById("lockWith");
  const withdrawBtn = document.querySelector(".withdraw-btn");

  async function checkWithdrawalLock() {
    try {
      const doc = await firebaseDB.collection("settings").doc("withdrawal_control").get();
      const data = doc.data();

      if (data && data.locked === true) {
        // Show lock and disable withdrawal
        lockIcon.style.display = "inline";
        withdrawBtn.disabled = true;
        withdrawBtn.style.opacity = 0.5;
        withdrawBtn.textContent = "Withdrawals Disabled 🔒";
        withdrawBtn.style.cursor = "not-allowed";
      } else {
        // Unlock state
        lockIcon.style.display = "none";
        withdrawBtn.disabled = false;
        withdrawBtn.style.opacity = 1;
        withdrawBtn.textContent = "Withdraw";
        withdrawBtn.style.cursor = "pointer";
      }
    } catch (error) {
      console.error("Failed to check withdrawal lock:", error);
    }
  }

  // Run on load
  document.addEventListener("DOMContentLoaded", checkWithdrawalLock);
</script>
