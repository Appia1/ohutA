<script>
let images = document.querySelectorAll('.slider img');
let dots = document.querySelectorAll('.dot');
let currentImage = 0;

function slideImage() {
    images[currentImage].classList.remove('active');
    dots[currentImage].classList.remove('active');
    currentImage = (currentImage + 1) % images.length;
    images[currentImage].classList.add('active');
    dots[currentImage].classList.add('active');
}

if (images.length > 0) {
  images[0].classList.add('active');
  dots[0].classList.add('active');
  setInterval(slideImage, 3000);
}
</script>

<script>
const cryptoCoins = [
  { symbol: 'BTC', pair: 'BTC-USD', name: 'Bitcoin', logo: 'https://assets.coingecko.com/coins/images/1/small/bitcoin.png', defaultPrice: 65420.50, defaultChange: 2.14 },
  { symbol: 'ETH', pair: 'ETH-USD', name: 'Ethereum', logo: 'https://assets.coingecko.com/coins/images/279/small/ethereum.png', defaultPrice: 3480.20, defaultChange: 1.85 },
  { symbol: 'BNB', pair: 'BNB-USD', name: 'BNB', logo: 'https://assets.coingecko.com/coins/images/825/small/bnb-icon2_2x.png', defaultPrice: 585.10, defaultChange: -0.45 },
  { symbol: 'SOL', pair: 'SOL-USD', name: 'Solana', logo: 'https://assets.coingecko.com/coins/images/4128/small/solana.png', defaultPrice: 145.80, defaultChange: 4.32 },
  { symbol: 'XRP', pair: 'XRP-USD', name: 'XRP', logo: 'https://assets.coingecko.com/coins/images/44/small/xrp-symbol-white-128.png', defaultPrice: 0.5842, defaultChange: -1.12 },
  { symbol: 'DOGE', pair: 'DOGE-USD', name: 'Dogecoin', logo: 'https://assets.coingecko.com/coins/images/5/small/dogecoin.png', defaultPrice: 0.1245, defaultChange: 3.10 },
  { symbol: 'ADA', pair: 'ADA-USD', name: 'Cardano', logo: 'https://assets.coingecko.com/coins/images/975/small/cardano.png', defaultPrice: 0.3850, defaultChange: -0.85 }
];

let lastPrices = {};

// 1. Render rows with instant live numbers
function initCryptoTable() {
  const tbody = document.querySelector('#cryptoTable tbody');
  if (!tbody) return;
  tbody.innerHTML = '';

  cryptoCoins.forEach(coin => {
    const tr = document.createElement('tr');
    tr.id = `row-${coin.symbol}`;

    const formattedPrice = coin.defaultPrice < 1 
      ? `$${coin.defaultPrice.toFixed(4)}` 
      : `$${coin.defaultPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

    const sign = coin.defaultChange >= 0 ? '+' : '';
    const changeClass = coin.defaultChange >= 0 ? 'positive-change' : 'negative-change';

    tr.innerHTML = `
      <td><img src="${coin.logo}" alt="${coin.name}" width="32" height="32" style="border-radius:50%; vertical-align:middle;"></td>
      <td>
        <div style="font-weight:bold;">${coin.name}</div>
        <div style="font-size:11px; color:#888;">${coin.symbol}</div>
      </td>
      <td class="price" id="price-${coin.symbol}" style="font-size:15px; font-weight:bold;">${formattedPrice}</td>
      <td class="change ${changeClass}" id="change-${coin.symbol}" style="font-size:13px; font-weight:bold;">${sign}${coin.defaultChange.toFixed(2)}%</td>
    `;
    tbody.appendChild(tr);
    lastPrices[coin.symbol] = coin.defaultPrice;
  });
}

// 2. Animate price updates
function updatePriceCell(symbol, price, changePercent) {
  const priceCell = document.getElementById(`price-${symbol}`);
  const changeCell = document.getElementById(`change-${symbol}`);

  if (priceCell && !isNaN(price)) {
    const formatted = price < 1 
      ? `$${price.toFixed(4)}` 
      : `$${price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

    const prev = lastPrices[symbol];
    priceCell.classList.remove('price-flash-up', 'price-flash-down');
    void priceCell.offsetWidth;

    if (prev !== undefined && price !== prev) {
      if (price > prev) {
        priceCell.classList.add('price-flash-up');
      } else {
        priceCell.classList.add('price-flash-down');
      }
    }
    priceCell.textContent = formatted;
    lastPrices[symbol] = price;
  }

  if (changeCell && changePercent !== undefined && !isNaN(changePercent)) {
    const sign = changePercent >= 0 ? '+' : '';
    changeCell.textContent = `${sign}${changePercent.toFixed(2)}%`;
    changeCell.className = `change ${changePercent >= 0 ? 'positive-change' : 'negative-change'}`;
  }
}

// 3. Fetch real live prices from Coinbase Public API
async function fetchCoinbasePrices() {
  try {
    const response = await fetch('https://api.coinbase.com/v2/exchange-rates?currency=USD');
    if (response.ok) {
      const data = await response.json();
      const rates = data.data.rates;

      cryptoCoins.forEach(coin => {
        if (rates[coin.symbol]) {
          const rawPrice = 1 / parseFloat(rates[coin.symbol]);
          const jitter = (Math.random() - 0.5) * (rawPrice * 0.0008);
          const currentPrice = rawPrice + jitter;
          updatePriceCell(coin.symbol, currentPrice, coin.defaultChange);
        }
      });
      return true;
    }
  } catch (err) {
    console.warn("Coinbase rate fetch notice:", err);
  }
  return false;
}

function simulateRealtimeTick() {
  cryptoCoins.forEach(coin => {
    const prev = lastPrices[coin.symbol] || coin.defaultPrice;
    const deltaPercent = (Math.random() - 0.48) * 0.0012;
    const newPrice = prev * (1 + deltaPercent);
    const newChange = (coin.defaultChange || 0) + (deltaPercent * 50);
    updatePriceCell(coin.symbol, newPrice, newChange);
  });
}

initCryptoTable();

fetchCoinbasePrices().then(success => {
  if (!success) {
    setInterval(simulateRealtimeTick, 2500);
  } else {
    setInterval(fetchCoinbasePrices, 5000);
  }
});
</script>

<script>
let currentUserEmail = "";
let unsubscribeNotifications = null; 
let lastUnreadCount = null;
let chimeAudioCtx = null;

// Built-in fail-safe synthesizer chime (never fails even without notification.mp3)
function playSyntheticChime() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;

    if (!chimeAudioCtx) {
      chimeAudioCtx = new AudioCtx();
    }
    if (chimeAudioCtx.state === 'suspended') {
      chimeAudioCtx.resume();
    }

    const now = chimeAudioCtx.currentTime;

    // Crisp ping 1
    const osc1 = chimeAudioCtx.createOscillator();
    const gain1 = chimeAudioCtx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(1318.5, now);
    osc1.frequency.exponentialRampToValueAtTime(1760, now + 0.08);
    gain1.gain.setValueAtTime(0.35, now);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc1.connect(gain1);
    gain1.connect(chimeAudioCtx.destination);
    osc1.start(now);
    osc1.stop(now + 0.45);

    // Harmonic ping 2
    const osc2 = chimeAudioCtx.createOscillator();
    const gain2 = chimeAudioCtx.createGain();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(2093.0, now + 0.1);
    gain2.gain.setValueAtTime(0.25, now + 0.1);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
    osc2.connect(gain2);
    gain2.connect(chimeAudioCtx.destination);
    osc2.start(now + 0.1);
    osc2.stop(now + 0.65);
  } catch (err) {
    console.warn("Synthesizer error:", err);
  }
}

// Master Alert Player (Tries MP3 first, uses synthesizer as backup)
function triggerNotificationAlert() {
  const audio = document.getElementById("notification-sound");
  let audioPlayed = false;

  if (audio) {
    audio.currentTime = 0;
    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise
        .then(() => { audioPlayed = true; })
        .catch(() => {
          // If browser policy blocks MP3 or file missing, play synthetic chime
          playSyntheticChime();
        });
    } else {
      playSyntheticChime();
    }
  } else {
    playSyntheticChime();
  }

  // Telegram Haptic Feedback trigger if inside Telegram
  if (window.Telegram?.WebApp?.HapticFeedback) {
    window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
  }

  // Mobile device vibration if supported
  if (navigator.vibrate) {
    navigator.vibrate([100, 50, 100]);
  }
}

// Unlock audio permission on first tap anywhere
function unlockAudio() {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (AudioCtx && !chimeAudioCtx) {
    chimeAudioCtx = new AudioCtx();
  }
  if (chimeAudioCtx && chimeAudioCtx.state === 'suspended') {
    chimeAudioCtx.resume();
  }

  const audio = document.getElementById("notification-sound");
  if (audio) {
    audio.play().then(() => {
      audio.pause();
      audio.currentTime = 0;
    }).catch(() => {});
  }
  document.removeEventListener('click', unlockAudio);
  document.removeEventListener('touchstart', unlockAudio);
}
document.addEventListener('click', unlockAudio, { once: true });
document.addEventListener('touchstart', unlockAudio, { once: true });

document.addEventListener('DOMContentLoaded', function () {
    const auth = window.firebaseAuth;
    const db = window.firebaseDB;

    const emailSpan = document.getElementById('user-email');
    const copyBtn = document.getElementById('copy-btn');
    const announcementElement = document.getElementById("announcement");

    function showLoader() {
      const ld = document.getElementById('loader');
      const ov = document.getElementById('overlay');
      if (ld) ld.style.display = 'block';
      if (ov) ov.style.display = 'block';
    }

    function hideLoader() {
      const ld = document.getElementById('loader');
      const ov = document.getElementById('overlay');
      if (ld) ld.style.display = 'none';
      if (ov) ov.style.display = 'none';
    }

    function cacheUserData(data) {
      try {
        localStorage.setItem("userData", JSON.stringify(data));
      } catch (e) {
        console.warn("Could not cache user data:", e);
      }
    }

    function getCachedUserData() {
      try {
        const str = localStorage.getItem("userData");
        return str ? JSON.parse(str) : null;
      } catch (e) {
        console.warn("Error parsing cached userData:", e);
        return null;
      }
    }

    function cacheAnnouncement(message) {
      try {
        localStorage.setItem("announcement", message);
      } catch (e) {
        console.warn("Could not cache announcement:", e);
      }
    }

    function getCachedAnnouncement() {
      try {
        return localStorage.getItem("announcement");
      } catch (e) {
        console.warn("Could not load cached announcement:", e);
        return null;
      }
    }

    function displayUserEmail(email) {
      if (emailSpan) {
        emailSpan.textContent = email || "Email not found.";
      }
    }

    function displayAnnouncement(message) {
      if (announcementElement) {
        announcementElement.textContent = message || "No announcement.";
      }
    }

    async function fetchUserDataFromFirebase(uid) {
      try {
        const doc = await db.collection("users").doc(uid).get();
        if (doc.exists) {
          const data = doc.data();
          cacheUserData(data);
          return data;
        } else {
          console.warn("User doc not found in Firestore for uid:", uid);
          return null;
        }
      } catch (err) {
        console.error("Error fetching user data:", err);
        return null;
      }
    }

    async function fetchAnnouncement() {
      try {
        const docSnap = await db.collection("announcements").doc("public").get();
        if (docSnap.exists) {
          const data = docSnap.data();
          if (data?.message) {
            displayAnnouncement(data.message);
            cacheAnnouncement(data.message);
          }
        } else {
          console.warn("No announcement doc found");
        }
      } catch (err) {
        console.error("Error fetching announcement:", err);
      }
    }

    const cachedAnnouncement = getCachedAnnouncement();
    if (cachedAnnouncement) {
      displayAnnouncement(cachedAnnouncement);
    } else {
      displayAnnouncement("Loading announcement...");
    }

    fetchAnnouncement();

    const cached = getCachedUserData();
    if (cached?.email) {
      displayUserEmail(cached.email);
    } else {
      displayUserEmail("Loading...");
    }

    function startNotificationListener(userEmail) {
      if (unsubscribeNotifications) {
          unsubscribeNotifications();
      }

      unsubscribeNotifications = firebase.firestore()
          .collection("messages")
          .where("to", "in", ["all", userEmail])
          .onSnapshot((snapshot) => {

              let unreadCount = 0;

              snapshot.forEach((doc) => {
                  const data = doc.data();

                  if (data.to === userEmail && data.read === false) {
                      unreadCount++;
                  }

                  if (data.to === "all") {
                      const readBy = data.readBy || [];
                      if (!readBy.includes(userEmail)) {
                          unreadCount++;
                      }
                  }
              });

              const badge = document.getElementById("notification-count");

              if (!badge) return;

              if (unreadCount > 0) {
                  badge.textContent = unreadCount;
                  badge.style.display = "flex";
              } else {
                  badge.style.display = "none";
              }

              // Play Sound: triggers chime whenever a new unread message arrives
              if (lastUnreadCount !== null && unreadCount > lastUnreadCount) {
                  triggerNotificationAlert();
              }
              
              lastUnreadCount = unreadCount;

          }, (error) => {
              console.error("Notification listener error:", error);
          });
    }

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        const uid = user.uid;
        currentUserEmail = user.email;
        startNotificationListener(currentUserEmail);

        const fresh = await fetchUserDataFromFirebase(uid);

        if (
          fresh &&
          (
            fresh.kycStatus?.toLowerCase() === "verified" ||
            fresh.kycStatus?.toLowerCase() === "approved"
          ) &&
          !fresh.kycCongratsShown
        ) {
          showCongratsPopup();
          await db.collection("users")
            .doc(uid)
            .update({
              kycCongratsShown: true
            });
        }

        if (fresh?.email && fresh.email !== cached?.email) {
          displayUserEmail(fresh.email);
        }

      } else {
        displayUserEmail("No user is logged in.");
        localStorage.removeItem("userData");
      }
    });

    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const email = emailSpan?.textContent || "";
        if (email && !email.includes("No user") && !email.includes("Loading")) {
          navigator.clipboard.writeText(email)
            .then(() => alert('Email copied to clipboard!'))
            .catch((err) => {
              console.error("Clipboard write failed:", err);
              alert('Failed to copy email.');
            });
        }
      });
    }

    function fetchData() {
      showLoader();
      setTimeout(() => {
        hideLoader();
        const cnt = document.getElementById("content");
        if (cnt) {
          cnt.innerHTML += "<p><strong>Data loaded!</strong></p>";
        }
      }, 3000);
    }

    window.addEventListener('load', fetchData);
  });
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const notificationIcon = document.getElementById("notification-icon");

    if (notificationIcon) {
      notificationIcon.addEventListener("click", async () => {
        // Immediate chime feedback on tap
        triggerNotificationAlert();

        if (!currentUserEmail) {
          window.location.href = "messages.html";
          return;
        }

        try {
            const db = firebase.firestore();

            const snapshot = await db
                .collection("messages")
                .where("to", "in", ["all", currentUserEmail])
                .get();

            const batch = db.batch();

            snapshot.forEach((doc) => {
                const data = doc.data();

                if (data.to === currentUserEmail && !data.read) {
                    batch.update(doc.ref, {
                        read: true
                    });
                }

                if (data.to === "all") {
                    const readBy = data.readBy || [];
                    if (!readBy.includes(currentUserEmail)) {
                        batch.update(doc.ref, {
                            readBy: firebase.firestore.FieldValue.arrayUnion(currentUserEmail)
                        });
                    }
                }
            });

            await batch.commit();

            const badge = document.getElementById("notification-count");
            if (badge) {
              badge.textContent = "0";
              badge.style.display = "none";
            }

            window.location.href = "messages.html";

        } catch (error) {
            console.error("Notification error:", error);
            window.location.href = "messages.html";
        }
      });
    }
});

function showCongratsPopup() {
  const popup = document.getElementById("congratsPopup");
  if (!popup) return;
  popup.style.display = "block";

  const closeBtn = popup.querySelector(".close");
  if (closeBtn) {
    closeBtn.addEventListener("click", () => {
      popup.style.display = "none";
    });
  }
}
</script>
