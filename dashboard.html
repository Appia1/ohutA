<script>
let images = document.querySelectorAll('.slider img');
let dots = document.querySelectorAll('.dot');
let currentImage = 0;

function slideImage() {
    images[currentImage].classList.remove('active');
    dots[currentImage].classList.remove('active');
    currentImage = (currentImage + 1) % images.length;
    images[currentImage].classList.add('active');
    dots[currentImage].classList.add('active');
}

images[0].classList.add('active');
dots[0].classList.add('active');

setInterval(slideImage, 3000);
</script>

<script>
    async function fetchCryptoData() {
      try {
        const response = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=10&page=1');
        
        if (!response.ok) {
          throw new Error('Failed to fetch data');
        }
        
        const data = await response.json();

        const cryptoTableBody = document.querySelector('#cryptoTable tbody');
        cryptoTableBody.innerHTML = '';

        data.forEach((coin, index) => {
          const row = document.createElement('tr');

          const logo = document.createElement('td');
          const logoImage = document.createElement('img');
          logoImage.src = coin.image;
          logo.appendChild(logoImage);

          const name = document.createElement('td');
          name.textContent = coin.name;

          const price = document.createElement('td');
          price.classList.add('price');
          price.textContent = `$${coin.current_price.toFixed(2)}`;

          const change = document.createElement('td');
          change.classList.add('change');
          const changeText = `${coin.price_change_percentage_24h.toFixed(2)}%`;
          if (coin.price_change_percentage_24h < 0) {
            change.classList.add('negative-change');
          } else {
            change.classList.add('positive-change');
          }
          change.textContent = changeText;

          row.appendChild(logo);
          row.appendChild(name);
          row.appendChild(price);
          row.appendChild(change);

          cryptoTableBody.appendChild(row);
        });
      } catch (error) {
        console.error('Error fetching crypto data:', error);
        document.querySelector('#cryptoTable tbody').innerHTML = '<tr><td colspan="4">Failed to load data. Please try again later.</td></tr>';
      }
    }

    setInterval(fetchCryptoData, 20000);
    fetchCryptoData();
</script>

<script>

// Helper function to play sound & trigger Telegram vibration
function triggerNotificationAlert() {
  const audio = document.getElementById("notification-sound");
  if (audio) {
    audio.currentTime = 0;
    audio.play().catch((err) => {
      console.warn("Audio play blocked by browser policy:", err);
    });
  }

  // Telegram Haptic Feedback trigger if inside Telegram
  if (window.Telegram?.WebApp?.HapticFeedback) {
    window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
  }
}

// User Interaction Unlocker for Browser Autoplay Restrictions
function unlockAudio() {
  const audio = document.getElementById("notification-sound");
  if (audio) {
    audio.play().then(() => {
      audio.pause();
      audio.currentTime = 0;
    }).catch(() => {});
  }
  document.removeEventListener('click', unlockAudio);
  document.removeEventListener('touchstart', unlockAudio);
}
document.addEventListener('click', unlockAudio);
document.addEventListener('touchstart', unlockAudio);

document.addEventListener('DOMContentLoaded', function () {
    const auth = window.firebaseAuth;
    const db = window.firebaseDB;

    const emailSpan = document.getElementById('user-email');
    const copyBtn = document.getElementById('copy-btn');
    const announcementElement = document.getElementById("announcement");

    function showLoader() {
      const ld = document.getElementById('loader');
      const ov = document.getElementById('overlay');
      if (ld) ld.style.display = 'block';
      if (ov) ov.style.display = 'block';
    }

    function hideLoader() {
      const ld = document.getElementById('loader');
      const ov = document.getElementById('overlay');
      if (ld) ld.style.display = 'none';
      if (ov) ov.style.display = 'none';
    }

    function cacheUserData(data) {
      try {
        localStorage.setItem("userData", JSON.stringify(data));
      } catch (e) {
        console.warn("Could not cache user data:", e);
      }
    }

    function getCachedUserData() {
      try {
        const str = localStorage.getItem("userData");
        return str ? JSON.parse(str) : null;
      } catch (e) {
        console.warn("Error parsing cached userData:", e);
        return null;
      }
    }

    function cacheAnnouncement(message) {
      try {
        localStorage.setItem("announcement", message);
      } catch (e) {
        console.warn("Could not cache announcement:", e);
      }
    }

    function getCachedAnnouncement() {
      try {
        return localStorage.getItem("announcement");
      } catch (e) {
        console.warn("Could not load cached announcement:", e);
        return null;
      }
    }

    function displayUserEmail(email) {
      if (emailSpan) {
        emailSpan.textContent = email || "Email not found.";
      }
    }

    function displayAnnouncement(message) {
      if (announcementElement) {
        announcementElement.textContent = message || "No announcement.";
      }
    }

    async function fetchUserDataFromFirebase(uid) {
      try {
        const doc = await db.collection("users").doc(uid).get();
        if (doc.exists) {
          const data = doc.data();
          cacheUserData(data);
          return data;
        } else {
          console.warn("User doc not found in Firestore for uid:", uid);
          return null;
        }
      } catch (err) {
        console.error("Error fetching user data:", err);
        return null;
      }
    }

    async function fetchAnnouncement() {
      try {
        const docSnap = await db.collection("announcements").doc("public").get();
        if (docSnap.exists) {
          const data = docSnap.data();
          if (data?.message) {
            displayAnnouncement(data.message);
            cacheAnnouncement(data.message);
          }
        } else {
          console.warn("No announcement doc found");
        }
      } catch (err) {
        console.error("Error fetching announcement:", err);
      }
    }

    const cachedAnnouncement = getCachedAnnouncement();
    if (cachedAnnouncement) {
      displayAnnouncement(cachedAnnouncement);
    } else {
      displayAnnouncement("Loading announcement...");
    }

    fetchAnnouncement();

    const cached = getCachedUserData();
    if (cached?.email) {
      displayUserEmail(cached.email);
    } else {
      displayUserEmail("Loading...");
    }

function startNotificationListener(userEmail) {

    if (unsubscribeNotifications) {
        unsubscribeNotifications();
    }

    unsubscribeNotifications = firebase.firestore()
        .collection("messages")
        .where("to", "in", ["all", userEmail])
        .onSnapshot((snapshot) => {

            let unreadCount = 0;

            snapshot.forEach((doc) => {
                const data = doc.data();

                // Private message
                if (
                    data.to === userEmail &&
                    data.read === false
                ) {
                    unreadCount++;
                }

                // Broadcast message
                if (data.to === "all") {
                    const readBy = data.readBy || [];

                    if (!readBy.includes(userEmail)) {
                        unreadCount++;
                    }
                }
            });

            const badge = document.getElementById("notification-count");

            if (!badge) return;

            if (unreadCount > 0) {
                badge.textContent = unreadCount;
                badge.style.display = "flex";
            } else {
                badge.style.display = "none";
            }

            // Play Sound logic: only trigger if unread notifications increased
            if (lastUnreadCount !== null && unreadCount > lastUnreadCount) {
                triggerNotificationAlert();
            }
            
            // Save current count state
            lastUnreadCount = unreadCount;

        }, (error) => {
            console.error(error);
        });
}

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        const uid = user.uid;

currentUserEmail = user.email;
startNotificationListener(currentUserEmail);

        const fresh = await fetchUserDataFromFirebase(uid);

if (
  fresh &&
  (
    fresh.kycStatus?.toLowerCase() === "verified" ||
    fresh.kycStatus?.toLowerCase() === "approved"
  ) &&
  !fresh.kycCongratsShown
) {

  showCongratsPopup();

  await db.collection("users")
    .doc(uid)
    .update({
      kycCongratsShown: true
    });

}

        if (fresh?.email && fresh.email !== cached?.email) {
          displayUserEmail(fresh.email);
        }

      } else {
        displayUserEmail("No user is logged in.");
        localStorage.removeItem("userData");
      }
    });

    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const email = emailSpan?.textContent || "";
        if (email && !email.includes("No user") && !email.includes("Loading")) {
          navigator.clipboard.writeText(email)
            .then(() => alert('Email copied to clipboard!'))
            .catch((err) => {
              console.error("Clipboard write failed:", err);
              alert('Failed to copy email.');
            });
        }
      });
    }

    function fetchData() {
      showLoader();
      setTimeout(() => {
        console.log("Data loaded (simulated).");
        hideLoader();
        const cnt = document.getElementById("content");
        if (cnt) {
          cnt.innerHTML += "<p><strong>Data loaded!</strong></p>";
        }
      }, 3000);
    }

    window.addEventListener('load', fetchData);
  });
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const logoutBtn = document.getElementById('logout-btn');

    if (logoutBtn) {
      logoutBtn.addEventListener('click', async () => {
        try {
          await firebase.auth().signOut();
          localStorage.clear();
          alert("You have been signed out.");
          window.location.href = "index.html";
        } catch (error) {
          console.error("Logout failed:", error);
          alert("Failed to log out. Try again.");
        }
      });
    }
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const notificationIcon = document.getElementById("notification-icon");

    notificationIcon.addEventListener("click", async () => {

        if (!currentUserEmail) return;

        try {

            const db = firebase.firestore();

            const snapshot = await db
                .collection("messages")
                .where("to", "in", ["all", currentUserEmail])
                .get();

            const batch = db.batch();

            snapshot.forEach((doc) => {

                const data = doc.data();

                if (data.to === currentUserEmail && !data.read) {
                    batch.update(doc.ref, {
                        read: true
                    });
                }

                if (data.to === "all") {

                    const readBy = data.readBy || [];

                    if (!readBy.includes(currentUserEmail)) {
                        batch.update(doc.ref, {
                            readBy: firebase.firestore.FieldValue.arrayUnion(currentUserEmail)
                        });
                    }
                }

            });

            await batch.commit();

            const badge = document.getElementById("notification-count");
            badge.textContent = "0";
            badge.style.display = "none";

            window.location.href = "messages.html";

        } catch (error) {
            console.error("Notification error:", error);
        }

    });

});

function showCongratsPopup() {
  const popup = document.getElementById("congratsPopup");
  popup.style.display = "block";

  popup.querySelector(".close").addEventListener("click", () => {
    popup.style.display = "none";
  });
}
</script>
